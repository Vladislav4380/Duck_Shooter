<div class="app">
  <app-start-screen 
    *ngIf="currentScreen === 'start'"
    (startGame)="onStartGame()">
  </app-start-screen>

  <app-game-screen 
    *ngIf="currentScreen === 'game'"
    (gameEnd)="onGameEnd()">
  </app-game-screen>

  <app-result-screen 
    *ngIf="currentScreen === 'result'"
    [finalScore]="gameState?.score || 0"
    [hits]="gameState?.hits || 0"
    [misses]="gameState?.misses || 0"
    (playAgain)="onPlayAgain()">
  </app-result-screen>

  <div class="landscape-hint" *ngIf="showLandscapeHint">
    <img src="assets/duck_normal.png" alt="Duck" class="landscape-duck">
    <div class="phone-turn" aria-hidden="true"></div>
    <h2>Поверніть телефон горизонтально</h2>
    <p>Гра розрахована на широкий екран</p>
  </div>
</div>
