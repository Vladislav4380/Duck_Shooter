<div class="start-screen">
  <!-- Background image -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="container">
    <!-- Title -->
    <div class="title-block">
      <div class="title-duck">
        <img src="assets/duck_normal.png" alt="" aria-hidden="true">
      </div>
      <h1 class="title">{{ translate('title') }}</h1>
      <div class="title-duck">
        <img src="assets/duck_normal.png" alt="" aria-hidden="true">
      </div>
    </div>

    <!-- Language selector -->
    <div class="language-selector">
      <button
        [class.active]="currentLanguage === 'uk'"
        (click)="changeLanguage('uk')"
        class="lang-btn">
        🇺🇦 Українська
      </button>
      <button
        [class.active]="currentLanguage === 'en'"
        (click)="changeLanguage('en')"
        class="lang-btn">
        🇬🇧 English
      </button>
    </div>

    <!-- Card -->
    <div class="card">
      <!-- Best score -->
      <div class="best-score">
        <span class="trophy">🏆</span>
        <span class="label">{{ translate('bestScore') }}:</span>
        <span class="score-value">{{ bestScore }}</span>
      </div>

      <!-- Rules -->
      <div class="rules-box">
        <h2>{{ translate('rules') }}</h2>
        <div class="rules-list">
          <div class="rule-item">
            <img class="rule-icon rule-duck" src="assets/duck_normal.png" alt="" aria-hidden="true">
            {{ translate('normalRule') }}
          </div>
          <div class="rule-item">
            <img class="rule-icon rule-duck" src="assets/duck_fast.png" alt="" aria-hidden="true">
            {{ translate('fastRule') }}
          </div>
          <div class="rule-item">
            <img class="rule-icon rule-duck" src="assets/duck_golden.png" alt="" aria-hidden="true">
            {{ translate('goldenRule') }}
          </div>
          <div class="rule-item">
            <img class="rule-icon" src="assets/crosshair.png" alt="" aria-hidden="true">
            {{ translate('smallRule') }}
          </div>
          <div class="rule-item">
            <img class="rule-icon" src="assets/timer_icon.png" alt="" aria-hidden="true">
            60 {{ translate('seconds') }}
          </div>
        </div>
      </div>

      <!-- Start button -->
      <div class="action-buttons">
        <button class="start-btn" (click)="onStartGame()">
        🎯 {{ translate('startGame') }}
        </button>
        <button class="share-btn" (click)="onShareGame()">
          <img src="assets/duck_normal.png" alt="" aria-hidden="true">
          {{ translate('shareGame') }}
        </button>
      </div>
    </div>
  </div>
</div>
